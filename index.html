 <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solo Leveling System</title>

<style>
body{
  margin:0;
  padding:20px;
  background:#080b14;
  color:white;
  font-family:Arial,sans-serif;
}
h1{text-align:center;color:#5cc8ff}
.card{
  background:#111827;
  border:1px solid #263449;
  border-radius:15px;
  padding:18px;
  margin:15px 0;
}
.xpbar{
  height:16px;
  background:#222b3d;
  border-radius:10px;
  overflow:hidden;
}
#xpFill{
  height:100%;
  width:0%;
  background:#35bfff;
}
.quest{
  background:#182235;
  padding:12px;
  border-radius:10px;
  margin:10px 0;
}
button{
  width:100%;
  padding:12px;
  margin-top:8px;
  border:0;
  border-radius:10px;
  background:#168cff;
  color:white;
  font-size:15px;
}
button:disabled{
  background:#444;
}
.stat{
  display:flex;
  justify-content:space-between;
  margin:10px 0;
}
input{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  border-radius:10px;
  border:1px solid #263449;
  background:#0d1422;
  color:white;
  margin-top:8px;
}
</style>
</head>

<body>

<h1>⚔ SYSTEM</h1>

<div class="card">
<h2>PLAYER</h2>
<p>Level: <b id="level">1</b></p>
<p>XP: <b id="xp">0</b> / 100</p>
<div class="xpbar">
<div id="xpFill"></div>
</div>
<p>🔥 Streak: <b id="streak">0</b> days</p>
</div>

<div class="card">
<h2>📊 STATS</h2>

<div class="stat">
<span>💪 Strength</span>
<b id="strength">1</b>
</div>

<div class="stat">
<span>🧠 Intelligence</span>
<b id="intelligence">1</b>
</div>

<div class="stat">
<span>🔥 Discipline</span>
<b id="discipline">1</b>
</div>
</div>

<div class="card">
<h2>🎯 DAILY QUESTS</h2>

<div class="quest">
📚 Study
<br>
+30 XP
<br>
⏱️ <span id="studyTimer">20:00</span>

<button onclick="startStudy()">Start Study</button>
<button id="studyComplete" onclick="verifyStudy()" disabled>
Complete Quest
</button>
</div>

<div class="quest">
🏃 Exercise
<br>
+25 XP
<button onclick="completeQuest(this,25)">Complete</button>
</div>

<div class="quest">
📖 Reading
<br>
+20 XP
<button onclick="completeQuest(this,20)">Complete</button>
</div>

<div class="quest">
🧹 Organize
<br>
+15 XP
<button onclick="completeQuest(this,15)">Complete</button>
</div>

</div>

<div class="card">
<h2>➕ CUSTOM QUEST</h2>

<input id="customQuest" placeholder="Enter your quest">

<input id="customXP" type="number" placeholder="XP reward">

<button onclick="addCustomQuest()">Add Quest</button>

<div id="customList"></div>
</div>

<script>

let data = JSON.parse(localStorage.getItem("soloSystem")) || {
  xp:0,
  level:1,
  streak:0,
  strength:1,
  intelligence:1,
  discipline:1
};

function save(){
  localStorage.setItem("soloSystem",JSON.stringify(data));
}

function update(){

  document.getElementById("xp").innerText=data.xp;
  document.getElementById("level").innerText=data.level;
  document.getElementById("streak").innerText=data.streak;

  document.getElementById("strength").innerText=data.strength;
  document.getElementById("intelligence").innerText=data.intelligence;
  document.getElementById("discipline").innerText=data.discipline;

  document.getElementById("xpFill").style.width=data.xp+"%";

  save();
}

function completeQuest(button,reward){

  if(button.dataset.verified !== "true"){
    alert("⚠ Quest not verified!\nComplete the actual task first.");
    return;
  }

  if(button.disabled)return;

  button.disabled=true;
  button.innerText="✓ Completed";

  data.xp += reward;
  data.streak++;

  if(data.xp>=100){

    data.xp -= 100;
    data.level++;

    data.strength++;
    data.intelligence++;
    data.discipline++;

    alert("⚔ LEVEL UP!\n\nYou reached Level "+data.level+"!");
  }

  update();
}
let studyTime = 20 * 60;
let studyInterval = null;
let studyStarted = false;

function startStudy(){

  if(studyStarted)return;

  studyStarted = true;

  document.querySelector('[onclick="startStudy()"]').disabled = true;

  studyInterval = setInterval(function(){

    studyTime--;

    let minutes = Math.floor(studyTime / 60);
    let seconds = studyTime % 60;

    document.getElementById("studyTimer").innerText =
      String(minutes).padStart(2,"0") + ":" +
      String(seconds).padStart(2,"0");

    if(studyTime <= 0){

      clearInterval(studyInterval);

      document.getElementById("studyTimer").innerText = "00:00";

      let button = document.getElementById("studyComplete");

      button.disabled = false;
      button.dataset.verified = "true";

      alert("📚 STUDY QUEST VERIFIED!\n\nYou completed the 20-minute study session.");
    }

  },1000);
}

function verifyStudy(){

  let button = document.getElementById("studyComplete");

  if(button.dataset.verified !== "true"){
    alert("⚠ Complete the full study session first.");
    return;
  }

  completeQuest(button,30);
 }
function addCustomQuest(){

  let name=document.getElementById("customQuest").value;
  let reward=parseInt(document.getElementById("customXP").value);

  if(!name || !reward){
    alert("Enter quest and XP.");
    return;
  }

  let div=document.createElement("div");

  div.className="quest";

  div.innerHTML=
    "🎯 "+name+
    "<br>+"+reward+" XP"+
    "<button>Complete</button>";

  div.querySelector("button").onclick=function(){
    completeQuest(this,reward);
  };

  document.getElementById("customList").appendChild(div);

  document.getElementById("customQuest").value="";
  document.getElementById("customXP").value="";
}

update();

</script>

</body>
</html>
