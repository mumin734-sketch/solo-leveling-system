<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solo Leveling System</title>

  <style>
    body {
      margin: 0;
      background: #080b14;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #5cc8ff;
    }

    .card {
      background: #111827;
      border: 1px solid #263449;
      border-radius: 15px;
      padding: 18px;
      margin: 15px 0;
    }

    .stat {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
    }

    .xpbar {
      background: #222b3d;
      height: 15px;
      border-radius: 10px;
      overflow: hidden;
    }

    #xpFill {
      height: 100%;
      width: 0%;
      background: #35bfff;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #168cff;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>

<h1>⚔ SYSTEM</h1>

<div class="card">
  <h2>PLAYER</h2>
  <p>Level: <b id="level">1</b></p>
  <p>XP: <b id="xp">0</b> / 100</p>

  <div class="xpbar">
    <div id="xpFill"></div>
  </div>
</div>

<div class="card">
  <h2>STATS</h2>

  <div class="stat">
    <span>💪 Strength</span>
    <b id="strength">1</b>
  </div>

  <div class="stat">
    <span>🧠 Intelligence</span>
    <b id="intelligence">1</b>
  </div>

  <div class="stat">
    <span>🔥 Discipline</span>
    <b id="discipline">1</b>
  </div>
</div>

<div class="card">
  <h2>DAILY QUEST</h2>

  <p>Complete your first task.</p>

  <button onclick="completeQuest()">
    Complete Quest +25 XP
  </button>
</div>

<script>

let xp = 0;
let level = 1;

function updateSystem() {

  document.getElementById("xp").innerText = xp;
  document.getElementById("level").innerText = level;

  let percentage = xp;

  document.getElementById("xpFill").style.width =
    percentage + "%";
}

function completeQuest() {

  xp += 25;

  if (xp >= 100) {
    xp -= 100;
    level++;

    alert("LEVEL UP! ⚔");
  }

  updateSystem();
}

updateSystem();

</script>

</body>
  </html>
